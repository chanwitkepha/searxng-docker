use_default_settings:
  engines:
    keep_only:
      - bing
      - wikipedia
      - github
      - stackoverflow

general:
  debug: false
  instance_name: "Private SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
  suspended_times:
    SearxEngineAccessDenied: 300
    SearxEngineTooManyRequests: 300
    SearxEngineCaptcha: 600

server:
  port: 8080
  bind_address: "0.0.0.0"
  base_url: "http://10.8.0.1:18080/"
  secret_key: "local-private-instance"
  limiter: false
  image_proxy: false

outgoing:
  request_timeout: 4.0
  useragent_suffix: "admin@your-domain.com"

engines:
  - name: bing
    weight: 1.5  # เพิ่มน้ำหนักให้ Bing
    disabled: false

  - name: wikipedia
    weight: 1.5
    disabled: false

  - name: github
    weight: 1.4
    disabled: false

  - name: stackoverflow
    weight: 1.2
    disabled: false
